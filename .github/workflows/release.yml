name: Release

# Push a tag like v0.2.0 to build signed APKs and publish a GitHub release.
# Pull requests that touch the build run the same signed build (artifacts only,
# nothing published) so signing problems show up before a tag is pushed.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/build.gradle.kts"
      - "app/proguard-rules.pro"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set (see README → Releases)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            export VERSION_NAME="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          # always increasing, and above any local/dev build
          export VERSION_CODE="$((GITHUB_RUN_NUMBER + 100))"
          ./gradlew assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          src=app/build/outputs/apk/release
          cp "$src/app-arm64-v8a-release.apk" out/silent-dictate-arm64-v8a.apk
          cp "$src/app-x86_64-release.apk"    out/silent-dictate-x86_64.apk
          cp "$src/app-universal-release.apk" out/silent-dictate-universal.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs out/silent-dictate-arm64-v8a.apk | head -3
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: out/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Which file?** Most phones: `silent-dictate-arm64-v8a.apk`. Emulators: `silent-dictate-x86_64.apk`. Not sure: `silent-dictate-universal.apk` (bigger, works everywhere). Android 8.0+.

          After installing, open Silent Dictate and follow the setup steps. The lip-reading model (Auto-AVSR LRS3, 203 MB, research / non-commercial licence) is downloaded inside the app.
          NOTES
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Silent Dictate $GITHUB_REF_NAME" \
            --notes "$(cat notes.md)" \
            --generate-notes \
            --verify-tag
